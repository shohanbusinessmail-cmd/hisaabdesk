name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${TAG_INPUT}"
          else
            TAG="${REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "Tag OK: $TAG" ;;
            *) echo "::error::Tag must look like v1.2.3"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          GRADLE_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match app versionName ($GRADLE_VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore (when configured)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HISAABDESK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "HISAABDESK_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Release signing keystore restored."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets configured — building a debug-key signed development APK."
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble release APK
        env:
          HISAABDESK_KEYSTORE_PASSWORD: ${{ secrets.HISAABDESK_KEYSTORE_PASSWORD }}
          HISAABDESK_KEY_ALIAS: ${{ secrets.HISAABDESK_KEY_ALIAS }}
          HISAABDESK_KEY_PASSWORD: ${{ secrets.HISAABDESK_KEY_PASSWORD }}
          HISAABDESK_STORE_TYPE: 'PKCS12'
          SIGNING_AVAILABLE: ${{ env.SIGNED }}
        run: |
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            echo "::warning::No release keystore secrets — building a DEBUG-KEY-SIGNED development APK (installable, not a production signature)."
            ./gradlew --no-daemon :app:assembleRelease -PhisaabdeskDebugSigning=true
          fi

      - name: Locate and verify APK
        id: apk
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n 1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > badging.txt || true
          head -n 5 badging.txt
          if grep -q "package: name='com.shohankhan.hisaabdesk'" badging.txt; then
            echo "Package id verified: com.shohankhan.hisaabdesk"
          else
            echo "::warning::Could not verify package id from aapt2 output."
          fi

      - name: Verify APK signature
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if "$BT/apksigner" verify --verbose "$APK"; then
            echo "signature_verified=true" >> "$GITHUB_ENV"
          else
            echo "::error::APK signature verification failed"
            exit 1
          fi

      - name: Compute SHA-256 checksum
        run: |
          set -eu
          sha256sum "$APK" | awk '{print $1}' > checksum.txt
          echo "SHA256=$(cat checksum.txt)" >> "$GITHUB_ENV"
          if [ "${SIGNED:-}" = "true" ]; then
            ASSET="hisaabdesk-${VERSION}.apk"
          else
            ASSET="hisaabdesk-${VERSION}-debugsigned-dev.apk"
          fi
          cp "$APK" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "$ASSET" > apk_name.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisaabdesk-release-${{ env.VERSION }}
          path: |
            hisaabdesk-${{ env.VERSION }}*.apk
            checksum.txt
          if-no-files-found: error

      - name: Generate release notes
        run: |
          set -eu
          {
            echo "# হিসাবডেস্ক ${VERSION}"
            echo ""
            echo "অফলাইন-ফার্স্ট বাংলা ব্যক্তিগত অর্থ ও হিসাব ব্যবস্থাপনা অ্যাপ।"
            echo ""
            echo "## ডাউনলোড"
            echo "- APK: \`${ASSET}\`"
            echo "- SHA-256: \`${SHA256}\`"
            echo ""
            echo "## অ্যাপ তথ্য"
            echo "- Application ID: \`com.shohankhan.hisaabdesk\`"
            echo "- সংস্করণ: \`${VERSION}\` (versionCode $(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts))"
            echo "- ন্যূনতম Android: 8.0 (API 26)"
            if [ "${SIGNED:-}" = "true" ]; then
              echo "- সাইনিং: release keystore দিয়ে সাইন করা"
            else
              echo ""
              echo "> ⚠️ **ডেভেলপমেন্ট বিল্ড:** এই APK ডিবাগ কী দিয়ে সাইন করা (প্রোডাকশন নয়)। ইনস্টলযোগ্য,"
              echo "> তবে ভবিষ্যতে একই অ্যাপে আপডেট করতে একই কী প্রয়োজন। প্রকৃত রিলিজের জন্য রিপোজিটরিতে"
              echo "> সাইনিং secrets যোগ করে আবার ওয়ার্কফ্লো চালান।"
            fi
            echo ""
            echo "## ইনস্টলেশন"
            echo "APK ডাউনলোড করে Android ডিভাইসে ইনস্টল করুন। এর আগে তৈরি করা ব্যাকআপ থাকলে নতুন ডিভাইসে রিস্টোর করুন (ব্যাকআপ পাসওয়ার্ড প্রয়োজন)।"
            echo ""
            echo "বিস্তারিত: [README](https://github.com/${{ github.repository }}/blob/main/README.md) · [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          PREFLAG=""
          if [ "${SIGNED:-}" != "true" ]; then
            PREFLAG="--prerelease"
            echo "::warning::Publishing as PRE-RELEASE: APK is signed with a debug key, not a production key."
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" checksum.txt --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md $PREFLAG
          else
            gh release create "$TAG" \
              "$ASSET" \
              checksum.txt \
              --title "হিসাবডেস্ক ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              $PREFLAG
          fi
