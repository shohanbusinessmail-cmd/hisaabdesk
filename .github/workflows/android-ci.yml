name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          fi

      - name: Compile debug variant
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin 2>&1 | tee compile.log

      - name: Run unit tests
        if: success() || failure()
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Run Android lint
        if: success() || failure()
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee lint.log

      - name: Assemble debug APK
        if: success() || failure()
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee assemble.log

      - name: Publish diagnostics (annotations + summary)
        if: failure() || cancelled()
        run: |
          python3 - <<'PY'
          import re, os
          out = []
          out.append("## Build diagnostics")
          emitted = 0
          for fname in ["compile.log", "test.log", "lint.log", "assemble.log"]:
              if not os.path.exists(fname):
                  continue
              text = open(fname, errors="ignore").read().splitlines()
              out.append("")
              out.append(f"### {fname}")
              out.append("```")
              key = [l for l in text if re.search(r"^e: |error:|Execution failed|What went wrong|Caused by|FAILED|FAILURE:", l)]
              for l in key[-120:]:
                  out.append(l[:400])
              out.append("```")
              for ln in text:
                  m = re.match(r"^e: file://(?P<path>[^:]+):(?P<line>\d+):(?P<col>\d+) (?P<msg>.*)$", ln)
                  if m and emitted < 45:
                      emitted += 1
                      parts = m.group("path").split("/")
                      rel = "/".join(parts[parts.index("app"):]) if "app" in parts else m.group("path")
                      msg = " ".join(m.group("msg").split())[:250].replace("%", "%25").replace("\n", " ")
                      print(f"::error file={rel},line={m.group('line')},col={m.group('col')},title=Kotlin::{msg}")
              # test failures as errors
              pass
          import glob, xml.etree.ElementTree as ET
          details = []
          for xml_path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(xml_path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for fail in list(case.iter("failure")) + list(case.iter("error")):
                      msg = " ".join((fail.get("message") or fail.text or "").split())
                      name = f"{case.get('classname')}".split(".")[-1] + "." + (case.get("name") or "")
                      details.append(f"{name}: {msg[:400]}")
          if details:
              blob = " || ".join(details)[:18000].replace("%", "%25").replace("\n", " ")
              print(f"::error title=Test failure details ({len(details)})::{blob}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hisaabdesk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
